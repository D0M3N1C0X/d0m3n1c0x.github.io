<!doctype html><html><head><meta charset="utf-8"><style>
:root { --bg:#ffffff; --bg2:#f5f5f7; --ink:#1d1d1f; --ink2:#424245; --muted:#6e6e73; --line:#e8e8ed; --accent:#0071e3;
  --num: #1d1d1f; --chip:#f5f5f7; --glow:none; }
html.dark { --bg:#000; --bg2:#0b0c0f; --ink:#f5f5f7; --ink2:#c7c9d1; --muted:#8b8f9a; --line:#23262e; --accent:#4f8cff; --chip:#15171c;
  --glow: radial-gradient(55% 75% at 92% 0%, rgba(79,140,255,.30), transparent 70%), radial-gradient(45% 60% at 100% 45%, rgba(139,92,246,.24), transparent 70%); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { background: var(--bg); background-image: var(--glow); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
html:not(.dark) body { background-image: linear-gradient(180deg, #ffffff 0%, #ffffff 55%, #f5f5f7 100%); }
.w { position: absolute; inset: 64px 72px 56px; display: flex; flex-direction: column; }
.eb { font: 600 18px/1 -apple-system, "SF Pro Text", sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
h1 { font-weight: 700; font-size: 58px; line-height: 1.04; letter-spacing: -.025em; margin-top: 18px; max-width: 1050px; }
.sub { font-size: 25px; line-height: 1.35; color: var(--ink2); margin-top: 18px; max-width: 1020px; letter-spacing: -.005em; }
.stats { display: flex; gap: 56px; margin-top: auto; }
.st b { display: block; font-weight: 700; font-size: 60px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--num); }
html.dark .st b { background: linear-gradient(100deg, #ffffff 0%, #9cc0ff 55%, #b79cff 100%); -webkit-background-clip: text; color: transparent; }
.st span { display: block; font: 500 17px/1.3 -apple-system, "SF Pro Text", sans-serif; color: var(--muted); margin-top: 10px; max-width: 300px; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line);
  font: 500 16px -apple-system, "SF Pro Text", sans-serif; color: var(--muted); }
.chips { display: flex; gap: 8px; }
.chips i { font-style: normal; background: var(--chip); color: var(--ink2); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); }
html:not(.dark) .chips i { background: #ffffff; border-color: #d2d2d7; }
</style></head><body><div class="w">
<div class="eb" id="eb"></div><h1 id="t"></h1><p class="sub" id="s"></p>
<div class="stats" id="stats"></div>
<div class="foot"><span id="repo"></span><span class="chips" id="chips"></span></div></div>
<script>
const p = new URLSearchParams(location.search), spec = JSON.parse(p.get("spec"));
if (p.get("theme") === "dark") document.documentElement.classList.add("dark");
eb.textContent = spec.eyebrow; t.textContent = spec.title; s.textContent = spec.sub; repo.textContent = `github.com/D0M3N1C0X/${spec.repo}`;
stats.innerHTML = spec.stats.map(([n, l]) => `<div class="st"><b>${n}</b><span>${l}</span></div>`).join("");
chips.innerHTML = spec.chips.map((c) => `<i>${c}</i>`).join("");
</script></body></html>
